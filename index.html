<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0709" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Deliberately the Debian/Ubuntu PS1 shape. The `@` costs an exact-phrase
         match on "Jennifer Duong", so the description below carries the name. -->
    <title>jennifer@duong:~$</title>
    <meta
      name="description"
      content="Jennifer Duong, Melbourne based full-stack engineer. A lifetime's portfolio, reduced to a shell."
    />
    <link rel="canonical" href="https://jenduo.github.io/" />

    <!-- What a pasted link looks like in Slack, LinkedIn or a message. Without
         these it is a bare URL with no picture, which is precisely where this
         link gets shared. The title is a human name rather than the PS1 above:
         a card is read by people, not matched by a search engine. Absolute URLs,
         because a scraper does not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jenduo.github.io/" />
    <meta property="og:title" content="Jennifer Duong, software engineer" />
    <meta
      property="og:description"
      content="A Melbourne based full-stack engineer's portfolio, reduced to a shell. Explore it with ls, cd and cat."
    />
    <meta property="og:image" content="https://jenduo.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A terminal window in pink on black, showing Jennifer Duong's introduction."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
